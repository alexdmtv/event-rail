# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# The example application's schema files are generated by Rails on every migration, in
# Rails' own formatting. Excluding them keeps `bin/rails db:migrate` from failing lint.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "examples/*/db/*schema.rb"
