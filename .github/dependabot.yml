version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    # One pull request per ecosystem per week rather than one per gem: the development
    # bundle is large and individual bumps carry no information on their own.
    groups:
      development-dependencies:
        patterns: [ "*" ]
    ignore:
      # See the Gemfile: minitest 6 cannot run on the Rails 7.2 floor. Proposing it again
      # every week costs a full matrix run to rediscover that.
      - dependency-name: minitest
        versions: [ ">= 6" ]

  # The example application has its own bundle. Its lockfile is committed, as an
  # application's is, and the example job catches a bump that breaks it.
  - package-ecosystem: bundler
    directory: "/examples/shop"
    schedule:
      interval: weekly
    groups:
      example-dependencies:
        patterns: [ "*" ]

  # gemfiles/ is deliberately unmanaged. Dependabot's bundler ecosystem only recognises a
  # file named Gemfile or gems.rb, and that directory holds adapters.gemfile, so an entry
  # for it fails every run with "No files found in /gemfiles". Leaving it out is also the
  # correct policy: that bundle pins json below 3.0 because json 3 breaks Active Record's
  # JSON column encoding and with it Solid Queue, which is exactly the bump that must not
  # arrive automatically. Its adapter versions are reviewed by hand when the matrix moves.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
