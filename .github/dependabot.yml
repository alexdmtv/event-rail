version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    # One pull request per ecosystem per week rather than one per gem: the development
    # bundle is large and individual bumps carry no information on their own.
    groups:
      development-dependencies:
        patterns: [ "*" ]

  # adapters.gemfile is hand-written and pins gems the root bundle does not carry. The
  # per-Rails gemfiles are generated and untracked, so nothing else here is visible.
  - package-ecosystem: bundler
    directory: "/gemfiles"
    schedule:
      interval: weekly
    groups:
      adapter-dependencies:
        patterns: [ "*" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
