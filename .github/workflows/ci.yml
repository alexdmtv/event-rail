name: CI

on:
  # Pushes to main and every pull request. An unfiltered `push:` would run the whole
  # matrix twice for a pull request opened from a branch in this repository.
  push:
    branches: [ main ]
  pull_request:
  # A gem whose job is tracking Rails semantics should hear about a Rails patch release
  # that breaks it before the next commit happens to notice. Off the hour, because
  # scheduled runs at :00 queue behind everyone else's.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever controls the action's repository can move it, and every workflow
# referencing that tag runs the new code on its next build. Dependabot reads the trailing
# version comment and bumps the SHA and the comment together, so the pin costs no
# maintenance. This matters most for a workflow that will later hold `id-token: write`
# for publishing.
permissions:
  contents: read

# A newer push to a pull request makes the older run irrelevant; a run on main does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      - run: bin/rubocop

  core:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.2", "8.0", "8.1"]
    env:
      # The Gemfile pins bundler exactly, and Ruby 4.0 ships Bundler 4 as its default, so
      # a bare `bundle` would refuse the pin. setup-ruby sets this for its own commands;
      # the steps below need it too.
      BUNDLER_VERSION: "2.6.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the root bundle, which is what Appraisal reads from.
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.6.9"
          bundler-cache: true
      # Generated here rather than committed: a committed per-Rails gemfile carries its
      # own copy of every shared dependency, so a bump to the root Gemfile would leave
      # this matrix testing the stale copy and reporting green.
      - run: bundle exec appraisal generate
      - run: bundle install
        env:
          BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
      - run: bundle exec rake test
        env:
          BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile

  representative-adapters:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/adapters.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      # The whole suite, on the adapter bundle: the conformance tests run the Sidekiq,
      # Solid Queue, and OpenTelemetry legs only when those gems are present.
      - run: bundle exec rake test

  # The example application in examples/shop runs against this commit's source of the gem.
  # It uses only the gem's public API, so a breaking change fails here in the same pull
  # request that makes it. Newest Ruby only: the core matrix covers version support; this
  # job covers the design the example demonstrates.
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "4.0"
          working-directory: examples/shop
          bundler-cache: true
      - run: bin/rails db:prepare
        env:
          RAILS_ENV: test
      # Every test, the console's system tests included: `test` covers test/system.
      - run: bin/rails test test engines/*/test
      - run: bin/packwerk validate
      - run: bin/packwerk check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      - run: bundle exec rake build
      - run: bundle exec ruby bin/verify-package pkg/event_rail-*.gem
