name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      - run: bin/rubocop

  core:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.2", "8.0", "8.1"]
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.6.9"
          bundler-cache: true
      - run: bundle exec rake test

  representative-adapters:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/adapters.gemfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      # The whole suite, on the adapter bundle: the conformance tests run the Sidekiq,
      # Solid Queue, and OpenTelemetry legs only when those gems are present.
      - run: bundle exec rake test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      - run: bundle exec rake build
      - run: bundle exec ruby bin/verify-package pkg/event_rail-*.gem
