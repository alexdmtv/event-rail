shop: &shop
  hand_over_staged_jobs:
    class: Platform::StagedJobRelayJob
    schedule: every second
  retry_interrupted_jobs:
    class: Platform::RetryInterruptedJobsJob
    schedule: every minute
  enforce_order_deadlines:
    class: Orders::DeadlineSweepJob
    schedule: every minute
  # Solid Queue keeps finished jobs until cleared; with the relay running every second, the
  # queue database would otherwise grow without end, in development too.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *shop

# Nothing runs the schedule in tests; Platform's test support enqueues a task by its key (enqueue_scheduled).
test:
  <<: *shop

production:
  <<: *shop
