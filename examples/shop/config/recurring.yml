# Scheduled work. Each of these jobs starts outside every flow, so none carries EventRail's
# context; what they cause joins the flows of the orders they act on.
shop: &shop
  simulation_tick:
    class: Simulation::TickJob
    schedule: every second
  expire_abandoned_orders:
    class: Orders::ExpireAbandonedOrdersJob
    schedule: every minute
  prune_flow_records:
    class: Observability::PruneJob
    schedule: every 10 minutes
  # Solid Queue keeps finished jobs for a day, for the dashboard at /jobs; this deletes older
  # ones. With a tick every second and the simulator's traffic, the queue database would
  # otherwise grow without end in development too.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *shop

production:
  <<: *shop
