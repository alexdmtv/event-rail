# The host application: the developer console that composes the modules. It reads their
# public APIs and never their internals. Nothing depends on it.
enforce_dependencies: true
dependencies:
  - engines/platform
  - engines/catalog
  - engines/payments
  - engines/fulfillment
  - engines/orders
  - engines/notifications
  - engines/loyalty
  - engines/observability
  - engines/simulation
